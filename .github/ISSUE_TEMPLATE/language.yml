name: Translation or right-to-left problem
description: A string that reads wrong, or a layout that breaks in Arabic.
labels: [i18n]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Arabic, French, Spanish, English]
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL, for example https://blendpdf.com/ar/edit-pdf
  - type: textarea
    id: what
    attributes:
      label: What it says, and what it should say
      description: A screenshot helps.
    validations:
      required: true
