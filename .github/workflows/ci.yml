name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used anywhere in this workflow, and it does not deploy.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      # Deliberately NOT gates here:
      #
      #   npm run lint  - the codebase carries ~2k pre-existing ESLint errors.
      #                   Lint has never been enforced, so gating on it would
      #                   just mean permanently red CI. Chipping away at it is
      #                   a genuinely useful contribution; see CONTRIBUTING.md.
      #
      #   npm run build - needs native canvas bindings plus the conversion
      #                   binaries from scripts/provision-server.sh.
      #
      # Type check + tests are the meaningful signal for a PR.
