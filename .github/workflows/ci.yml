name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used anywhere in this workflow, and it does not deploy.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Not gates here:
      #
      #   npm run lint  - the codebase carries a backlog of old ESLint errors.
      #                   Lint has never been enforced, so gating on it would
      #                   mean permanently red CI. See CONTRIBUTING.md.
      #
      #   npm run build - needs native canvas bindings; the server tools also
      #                   need the programs from scripts/provision-server.sh.
